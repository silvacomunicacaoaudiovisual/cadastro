<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Cadastro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --azul-marinho-escuro: #050d27;
            --azul-marinho-medio: #0432b3;
            --azul-botao: #0441c5;
            --cinza-fundo-input: #050d27;
            --texto-principal: #ffffff;
        }
    </style>
</head>
<body class="bg-[var(--azul-marinho-escuro)] p-4 md:p-10 text-[var(--texto-principal)] font-sans">

    <div id="tela-login" class="max-w-sm mx-auto bg-[var(--azul-marinho-medio)] p-6 rounded-xl border border-slate-800 shadow-xl mt-20">
        <h2 class="text-2xl font-bold text-white mb-1 text-center">Acessar Painel</h2>
        <p class="text-xs text-slate-300 mb-6 text-center"></p>

        <form id="form-login" class="space-y-4">
            <div>
                <label class="block text-[12px] text-white uppercase font-bold mb-1">Telefone</label>
                <input type="text" id="login-telefone" placeholder="(96) 99999-9999" maxlength="15" required autocomplete="off" class="w-full bg-[var(--cinza-fundo-input)] border border-slate-800 p-2.5 rounded-lg text-sm">
            </div>
            <div>
                <label class="block text-[12px] text-white uppercase font-bold mb-1">Informe seu PIN de 4 dígitos para entrar</label>
                <input type="password" id="login-senha" placeholder="0000" maxlength="4" inputmode="numeric" required autocomplete="off" class="w-full bg-[var(--cinza-fundo-input)] border border-slate-800 p-2.5 rounded-lg text-sm">
            </div>
            <p id="login-erro" class="text-red-400 text-xs hidden"></p>
            <button type="submit" id="btn-login" class="w-full bg-[var(--azul-botao)] hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition shadow-lg">
                Entrar
            </button>
        </form>
    </div>

    <div id="tela-cadastro" class="max-w-lg mx-auto bg-[var(--azul-marinho-medio)] p-6 rounded-xl border border-slate-800 shadow-xl hidden">
        <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-3">
            <h2 class="text-2xl font-bold text-white">Painel do Usuário</h2>
            <div class="text-right">
                <p class="text-xs text-slate-300">Logado como</p>
                <p id="lider-logado-nome" class="text-sm font-bold text-white mb-2"></p>
                <button id="btn-sair" type="button" class="inline-flex items-center gap-1.5 text-xs font-bold text-red-300 border border-red-400/40 bg-red-500/10 hover:bg-red-500/20 hover:text-red-200 py-1.5 px-3 rounded-lg transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 001 1h6a1 1 0 100-2H4V6h5a1 1 0 100-2H3zm10.293 3.293a1 1 0 011.414 0l3 3a1 1 0 010 1.414l-3 3a1 1 0 01-1.414-1.414L14.586 11H7a1 1 0 110-2h7.586l-1.293-1.293a1 1 0 010-1.414z" clip-rule="evenodd"/></svg>
                    Sair
                </button>
            </div>
        </div>

        <!-- LISTA DE CADASTROS DO LÍDER -->
        <div id="painel-lista">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-white">Meus Cadastros (<span id="contador-cadastros">0</span>)</h3>
                <button id="btn-abrir-form" type="button" class="bg-[var(--azul-botao)] hover:bg-blue-500 text-white text-sm font-bold py-2 px-4 rounded-lg transition shadow-lg">
                    + Cadastrar
                </button>
            </div>
            <div id="lista-meus-cadastros" class="space-y-2 max-h-[65vh] overflow-y-auto"></div>
        </div>

        <!-- FORMULÁRIO DE NOVO CADASTRO -->
        <div id="painel-form" class="hidden">
            <button id="btn-voltar-lista" type="button" class="inline-flex items-center gap-1.5 text-sm font-bold text-white border border-slate-700 bg-slate-900/60 hover:bg-slate-900 py-2 px-4 rounded-lg transition mb-4 shadow">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 111.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd"/></svg>
                Voltar para a lista
            </button>

            <form id="form-cadastro" class="space-y-4">
                <select id="input-municipio" required class="w-full bg-[var(--cinza-fundo-input)] border border-slate-800 p-2.5 rounded-lg text-sm text-white focus:border-blue-500 outline-none">
                    <option value="">Selecione um município...</option>
                </select>

                <div class="grid grid-cols-2 gap-4">
                    <select id="input-bairro" required class="w-full bg-[var(--cinza-fundo-input)] border border-slate-800 p-2.5 rounded-lg text-sm text-white focus:border-blue-500 outline-none">
                        <option value="">Selecione um bairro...</option>
                    </select>
                    <select id="input-escola" required class="w-full bg-[var(--cinza-fundo-input)] border border-slate-800 p-2.5 rounded-lg text-sm text-white focus:border-blue-500 outline-none">
                        <option value="">Selecione uma escola...</option>
                    </select>
                </div>

                <input type="text" id="input-lider" placeholder="Líder" readonly class="w-full bg-slate-900 border border-slate-800 p-2.5 rounded-lg text-sm opacity-80 cursor-not-allowed">
                <input type="text" id="input-nome" placeholder="Nome Completo" required class="w-full bg-[var(--cinza-fundo-input)] border border-slate-800 p-2.5 rounded-lg text-sm">
                <input type="text" id="input-mae" placeholder="Nome da Mãe" required class="w-full bg-[var(--cinza-fundo-input)] border border-slate-800 p-2.5 rounded-lg text-sm">
                
                <label class="block text-[12px] text-white uppercase font-bold">Data de Nascimento</label>
                <input type="text" id="input-nascimento" placeholder="DD/MM/AAAA" maxlength="10" required class="w-full bg-[var(--cinza-fundo-input)] border border-slate-800 p-2.5 rounded-lg text-sm">

                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="input-whatsapp" placeholder="(96) 99999-9999" maxlength="15" required class="w-full bg-[var(--cinza-fundo-input)] border border-slate-800 p-2.5 rounded-lg text-sm">
                    <select id="input-transporte" class="w-full bg-[var(--cinza-fundo-input)] border border-slate-800 p-2.5 rounded-lg text-sm">
                        <option value="Não">Sem Transporte</option>
                        <option value="Carro">Carro</option>
                        <option value="Moto">Moto</option>
                    </select>
                </div>

                <input type="text" id="input-instagram" placeholder="Instagram (@usuario)" class="w-full bg-[var(--cinza-fundo-input)] border border-slate-800 p-2.5 rounded-lg text-sm">
                <input type="text" id="input-facebook" placeholder="Facebook (nome ou link)" class="w-full bg-[var(--cinza-fundo-input)] border border-slate-800 p-2.5 rounded-lg text-sm">

                <button type="submit" id="btn-submit" class="w-full bg-[var(--azul-botao)] hover:bg-blue-500 text-white font-bold py-3 rounded-lg transition shadow-lg mt-4">
                    Enviar Cadastro
                </button>
            </form>
        </div>
    </div>

    <script>
        const supabaseClient = supabase.createClient("https://giwnfttgradamcdbmceg.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdpd25mdHRncmFkYW1jZGJtY2VnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI0MTAzMTcsImV4cCI6MjA5Nzk4NjMxN30.Du5QNQ4K_ImVEdOhmJPR8SIktwsxKn5vpvp53tMH3Rs");

        /* ---- Lista "Meus Cadastros" + alternância lista/formulário ---- */
        const painelLista = document.getElementById("painel-lista");
        const painelForm = document.getElementById("painel-form");

        function mostrarLista() {
            painelForm.classList.add("hidden");
            painelLista.classList.remove("hidden");
        }

        function mostrarForm() {
            painelLista.classList.add("hidden");
            painelForm.classList.remove("hidden");
        }

        function normalizarTexto(str) {
            return String(str || '').trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "");
        }

        async function carregarMeusCadastros(nomeLider) {
            const listaEl = document.getElementById("lista-meus-cadastros");
            const contadorEl = document.getElementById("contador-cadastros");
            listaEl.innerHTML = `<p class="text-xs text-slate-300 text-center py-4">Carregando...</p>`;

            const { data, error } = await supabaseClient.from('cadastros_votos').select('*');

            if (error) {
                listaEl.innerHTML = `<p class="text-xs text-red-400 text-center py-4">Erro ao carregar: ${error.message}</p>`;
                return;
            }

            const meus = (data || []).filter(item => normalizarTexto(item.lider) === normalizarTexto(nomeLider));
            contadorEl.textContent = meus.length;

            if (meus.length === 0) {
                console.log('[Meus Cadastros] Nenhum registro bateu com o líder "' + nomeLider + '". Nomes de líder existentes no banco:',
                    [...new Set((data || []).map(i => i.lider).filter(Boolean))]);
                listaEl.innerHTML = `<p class="text-xs text-slate-300 text-center py-6">Você ainda não cadastrou ninguém. Clique em "+ Cadastrar" para começar.</p>`;
                return;
            }

            listaEl.innerHTML = meus.slice().reverse().map(item => `
                <div class="bg-[var(--cinza-fundo-input)] border border-slate-800 rounded-lg p-3">
                    <p class="text-sm font-bold text-white">${item.nome || 'N/A'}</p>
                    <p class="text-xs text-slate-300">${item.escola || '---'} ${item.bairro ? '· ' + item.bairro : ''}</p>
                    <p class="text-xs text-slate-400">${item.whatsapp || '---'}</p>
                </div>
            `).join('');
        }

        /* ---- Login do líder ---- */
        const telaLogin = document.getElementById("tela-login");
        const telaCadastro = document.getElementById("tela-cadastro");
        const formLogin = document.getElementById("form-login");
        const loginErro = document.getElementById("login-erro");

        function mostrarErroLogin(msg) {
            loginErro.textContent = msg;
            loginErro.classList.remove("hidden");
        }

        function entrarComoLider(nome) {
            localStorage.setItem("liderLogadoNome", nome);
            document.getElementById("lider-logado-nome").textContent = nome;
            document.getElementById("input-lider").value = nome;
            telaLogin.classList.add("hidden");
            telaCadastro.classList.remove("hidden");
            mostrarLista();
            carregarMeusCadastros(nome);
        }

        // Mantém login entre visitas (o líder não precisa logar toda hora)
        const liderSalvo = localStorage.getItem("liderLogadoNome");
        if (liderSalvo) entrarComoLider(liderSalvo);

        document.getElementById("btn-sair").addEventListener("click", () => {
            localStorage.removeItem("liderLogadoNome");
            telaCadastro.classList.add("hidden");
            telaLogin.classList.remove("hidden");
            formLogin.reset();
            mostrarLista();
        });

        formLogin.addEventListener("submit", async (e) => {
            e.preventDefault();
            loginErro.classList.add("hidden");

            const telefoneDigitado = document.getElementById("login-telefone").value.replace(/\D/g, '');
            const senhaDigitada = document.getElementById("login-senha").value.trim();
            const btnLogin = document.getElementById("btn-login");

            if (telefoneDigitado.length < 10) { mostrarErroLogin("Digite o telefone completo, com DDD."); return; }
            if (senhaDigitada.length !== 4) { mostrarErroLogin("A senha são os 4 últimos dígitos do seu telefone."); return; }

            btnLogin.textContent = "Entrando...";
            btnLogin.disabled = true;

            const { data, error } = await supabaseClient
                .from('lideres')
                .select('*')
                .eq('telefone', telefoneDigitado)
                .maybeSingle();

            btnLogin.textContent = "Entrar";
            btnLogin.disabled = false;

            if (error) {
                mostrarErroLogin("Erro ao consultar login: " + error.message);
                return;
            }
            if (!data) {
                mostrarErroLogin("Telefone não encontrado. Fale com o administrador do sistema.");
                return;
            }
            if (data.telefone.slice(-4) !== senhaDigitada) {
                mostrarErroLogin("Senha incorreta.");
                return;
            }

            entrarComoLider(data.nome);
        });

        // Máscara do telefone de login
        document.getElementById("login-telefone").addEventListener("input", function (e) {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 11) v = v.slice(0, 11);
            if (v.length > 6) e.target.value = v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
            else if (v.length > 2) e.target.value = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
            else if (v.length > 0) e.target.value = v.replace(/(\d{0,2})/, '($1');
        });
        document.getElementById("login-senha").addEventListener("input", function (e) {
            e.target.value = e.target.value.replace(/\D/g, '').slice(0, 4);
        });

        document.getElementById("btn-abrir-form").addEventListener("click", mostrarForm);
        document.getElementById("btn-voltar-lista").addEventListener("click", mostrarLista);


        let listaNomes = [];

        const selectMunicipio = document.getElementById("input-municipio");
        const selectBairro = document.getElementById("input-bairro");
        const selectEscola = document.getElementById("input-escola");

        Object.keys(mapaMunicipios).sort().forEach(municipio => {
            const opt = document.createElement("option");
            opt.value = municipio;
            opt.textContent = municipio;
            selectMunicipio.appendChild(opt);
        });

        selectMunicipio.addEventListener("change", () => {
            const municipio = selectMunicipio.value;
            selectBairro.innerHTML = '<option value="">Selecione um bairro...</option>';
            selectEscola.innerHTML = '<option value="">Selecione uma escola...</option>';
            if (municipio && mapaMunicipios[municipio]) {
                Object.keys(mapaMunicipios[municipio]).sort().forEach(bairro => {
                    const opt = document.createElement("option");
                    opt.value = bairro;
                    opt.textContent = bairro;
                    selectBairro.appendChild(opt);
                });
            }
        });

        selectBairro.addEventListener("change", () => {
            const municipio = selectMunicipio.value;
            const bairro = selectBairro.value;
            selectEscola.innerHTML = '<option value="">Selecione uma escola...</option>';
            if (municipio && bairro && mapaMunicipios[municipio] && mapaMunicipios[municipio][bairro]) {
                mapaMunicipios[municipio][bairro].forEach(nomeEscola => {
                    const opt = document.createElement("option");
                    opt.value = nomeEscola;
                    opt.textContent = nomeEscola;
                    selectEscola.appendChild(opt);
                });
            }
        });

        document.getElementById("form-cadastro").addEventListener("submit", async (e) => {
            e.preventDefault();
            
            const inputNome = document.getElementById("input-nome");
            const nomeDigitado = inputNome.value.trim().toLowerCase();
            
            if (listaNomes.includes(nomeDigitado)) {
                alert("❌ Atenção: O nome " + inputNome.value.trim() + " já está cadastrado!");
                return;
            }

            const btn = document.getElementById("btn-submit");
            btn.textContent = "Enviando...";
            
            const dados = {
                municipio: selectMunicipio.value,
                bairro: selectBairro.value,
                escola: selectEscola.value,
                lider: document.getElementById("input-lider").value.trim() || '---',
                nome: inputNome.value.trim(),
                nome_mae: document.getElementById("input-mae").value.trim() || '---',
                nascimento: document.getElementById("input-nascimento").value.trim(),
                whatsapp: document.getElementById("input-whatsapp").value.trim(),
                transporte: document.getElementById("input-transporte").value,
                instagram: document.getElementById("input-instagram").value.trim() || '---',
                facebook: document.getElementById("input-facebook").value.trim() || '---'
            };
            
            const { error } = await supabaseClient.from('cadastros_votos').insert([dados]);
            
            if (error) {
                alert("Erro: " + error.message);
                btn.textContent = "Enviar Cadastro";
            } else { 
                alert("Cadastrado com sucesso!"); 
                listaNomes.push(nomeDigitado); 
                document.getElementById("form-cadastro").reset();
                selectBairro.innerHTML = '<option value="">Selecione um bairro...</option>';
                selectEscola.innerHTML = '<option value="">Selecione uma escola...</option>';
                document.getElementById("input-lider").value = document.getElementById("lider-logado-nome").textContent;
                btn.textContent = "Enviar Cadastro";
                mostrarLista();
                carregarMeusCadastros(document.getElementById("lider-logado-nome").textContent);
            }
        });

        // Máscara de Data de Nascimento (DD/MM/AAAA)
        document.getElementById('input-nascimento').addEventListener('input', (e) => {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 8) v = v.slice(0, 8);
            if (v.length > 4) {
                e.target.value = v.replace(/(\d{2})(\d{2})(\d{1,4})/, '$1/$2/$3');
            } else if (v.length > 2) {
                e.target.value = v.replace(/(\d{2})(\d{1,2})/, '$1/$2');
            } else {
                e.target.value = v;
            }
        });

        // Máscara de WhatsApp
        document.getElementById("input-whatsapp").addEventListener("input", function (e) {
            let v = e.target.value.replace(/\D/g, '');
            if (v.length > 11) v = v.slice(0, 11);
            if (v.length > 6) e.target.value = v.replace(/(\d{2})(\d{5})(\d{4})/, '($1) $2-$3');
            else if (v.length > 2) e.target.value = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
            else if (v.length > 0) e.target.value = v.replace(/(\d{0,2})/, '($1');
        });
    </script>
